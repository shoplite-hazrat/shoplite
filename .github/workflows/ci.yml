# CI for the ShopLite monorepo.
#
#   changes ──> test (per changed service) ──> build + scan (+ publish & sign on main)
#                                         └──> integration (full compose stack + smoke test)
#   ci-ok: single required status check that summarises everything above
#
# Third-party actions are pinned to full commit SHAs (tags can be moved by an
# attacker); Dependabot keeps the pins current.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs; never cancel a run on main mid-publish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}
  # Mirrors avoid the frequent rate limits on Trivy's default DB location.
  TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db,ghcr.io/aquasecurity/trivy-db
  TRIVY_JAVA_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-java-db,ghcr.io/aquasecurity/trivy-java-db

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      services: ${{ steps.services.outputs.changes }}
      stack: ${{ steps.stack.outputs.stack }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: services
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          # A change to this workflow rebuilds everything.
          filters: |
            catalog: [services/catalog/**, .github/workflows/ci.yml]
            order: [services/order/**, .github/workflows/ci.yml]
            notification: [services/notification/**, .github/workflows/ci.yml]
            frontend: [services/frontend/**, .github/workflows/ci.yml]
      - id: stack
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            stack: [services/**, compose.yaml, deploy/compose/**, scripts/**, .github/workflows/ci.yml]

  test:
    name: Test ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.services != '[]'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ---- Node services (catalog, frontend)
      - if: hashFiles(format('services/{0}/package.json', matrix.service)) != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: services/${{ matrix.service }}/.nvmrc
          cache: npm
          cache-dependency-path: services/${{ matrix.service }}/package-lock.json
      - if: hashFiles(format('services/{0}/package.json', matrix.service)) != ''
        name: Lint, typecheck, test (Node)
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npm run --if-present typecheck
          npm test

      # ---- Python services (order, notification)
      - if: hashFiles(format('services/{0}/pyproject.toml', matrix.service)) != ''
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: services/${{ matrix.service }}/uv.lock
      - if: hashFiles(format('services/{0}/pyproject.toml', matrix.service)) != ''
        name: Lint, format check, test (Python)
        run: |
          uv sync --locked
          uv run ruff check --output-format=github .
          uv run ruff format --check .
          uv run pytest

  build:
    name: Build ${{ matrix.service }}
    needs: [changes, test]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.services) }}
    permissions:
      contents: read
      packages: write # push to GHCR (main only)
      id-token: write # keyless cosign signing via GitHub OIDC (main only)
      security-events: write # upload Trivy results to the Security tab
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # Immutable sha-<commit> tag is what deployments reference; "main" is a convenience pointer.
          tags: |
            type=sha,format=short,prefix=sha-
            type=raw,value=main,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=shoplite-${{ matrix.service }}

      - name: Build image for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          load: true
          tags: shoplite/${{ matrix.service }}:scan
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

      - name: Scan for vulnerabilities (report)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shoplite/${{ matrix.service }}:scan
          format: sarif
          output: trivy.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"
      - name: Upload scan results to GitHub Security tab
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.service }}
      - name: Fail on fixable HIGH/CRITICAL vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: shoplite/${{ matrix.service }}:scan
          format: table
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
          skip-setup-trivy: true

      # ---- main only: publish, attest, sign
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push image with SBOM and provenance
        if: env.PUBLISH == 'true'
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          sbom: true
          provenance: mode=max
      - if: env.PUBLISH == 'true'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image (keyless, by digest)
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Summary
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### ${{ matrix.service }}"
            echo "Digest: \`${DIGEST}\`"
            echo '```'
            echo "${TAGS}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  integration:
    name: Integration (compose + smoke test)
    needs: [changes, test]
    # Run when the stack changed even if no service did (test then is
    # "skipped", which would otherwise skip this job too).
    if: >-
      !cancelled() && needs.changes.outputs.stack == 'true'
      && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build all images (reusing the build jobs' layer cache)
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          files: compose.yaml
          load: true
          set: |
            catalog*.cache-from=type=gha,scope=catalog
            order*.cache-from=type=gha,scope=order
            notification*.cache-from=type=gha,scope=notification
            frontend.cache-from=type=gha,scope=frontend
      - name: Start stack
        run: docker compose up -d --no-build --wait --wait-timeout 300
      - name: Smoke test
        run: ./scripts/smoke-test.sh
      - name: Diagnostics
        if: failure()
        run: |
          docker compose ps
          docker compose logs --no-color --tail=200
      - name: Tear down
        if: always()
        run: docker compose down --volumes

  deploy-dev:
    name: Deploy to dev (gitops PR)
    # Continuous delivery to dev: point envs/dev at the images this run just
    # published. Argo CD deploys once the gitops PR merges (auto-merge on green).
    needs: [changes, build, integration]
    if: >-
      github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.changes.outputs.services != '[]'
      && needs.build.result == 'success'
      && (needs.integration.result == 'success' || needs.integration.result == 'skipped')
    runs-on: ubuntu-24.04
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    env:
      # PRs opened with GITHUB_TOKEN don't trigger workflows (so gitops CI and
      # its required check would never run). This token is scoped to the
      # gitops repo only: contents + pull requests.
      GH_TOKEN: ${{ secrets.GITOPS_TOKEN }}
      SERVICES: ${{ needs.changes.outputs.services }}
    steps:
      - name: Check token
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Secret GITOPS_TOKEN is not set; cannot open the gitops PR."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/shoplite-gitops
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops
      - name: Bump image tags in envs/dev
        working-directory: gitops
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          BRANCH="deploy/dev-${TAG}"
          git config user.name "shoplite-ci"
          git config user.email "ci@shoplite.local"
          git switch -c "$BRANCH"
          for svc in $(echo "$SERVICES" | jq -r '.[]'); do
            file="envs/dev/services/${svc}.yaml"
            [ -f "$file" ] || { echo "skip $svc (not deployed to dev)"; continue; }
            TAG="$TAG" yq -i '.image.tag = strenv(TAG)' "$file"
          done
          if git diff --quiet; then echo "Nothing to change"; exit 0; fi
          git commit -am "deploy(dev): ${TAG} ($(echo "$SERVICES" | jq -r 'join(", ")'))"
          git push -u origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "deploy(dev): $(echo "$SERVICES" | jq -r 'join(", ")') -> ${TAG}" \
            --body "Automated deploy of ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }} to **dev**.

          Services: \`$(echo "$SERVICES" | jq -r 'join("`, `")')\`
          Images: \`ghcr.io/${{ github.repository_owner }}/<service>:${TAG}\` (signed, SBOM + provenance attached)
          Source run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Auto-merges when gitops CI passes; Argo CD then syncs dev."
          gh pr merge --auto --squash "$BRANCH"

  ci-ok:
    name: ci-ok
    # The one check required by branch protection. It summarises the jobs above,
    # which may be skipped when their files did not change.
    if: always()
    needs: [changes, test, build, integration]
    runs-on: ubuntu-24.04
    steps:
      - name: All required jobs passed or were skipped
        env:
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          test "$FAILED" = "false"
