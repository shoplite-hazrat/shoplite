# Static file server for the built SPA. API routing (/api/*) is NOT done here:
# the gateway in front of this container owns it, so this image only ever
# serves files and is identical in every environment.

log_format json escape=json
  '{"time":"$time_iso8601","level":"INFO","method":"$request_method",'
  '"path":"$request_uri","status":$status,"bytes":$body_bytes_sent,'
  '"duration_s":$request_time,"request_id":"$http_x_request_id",'
  '"user_agent":"$http_user_agent"}';

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  access_log /dev/stdout json;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Vite fingerprints asset filenames (index-3fa9c1.js), so they can be cached
  # forever: a new build produces new names.
  location /assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # index.html must never be cached, or users keep loading old asset names
  # after a deploy. Unknown paths fall back to it (client-side routing).
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }
}
