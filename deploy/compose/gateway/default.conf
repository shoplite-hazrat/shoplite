# Local stand-in for the Kubernetes Gateway: the single public entry point.
#   /api/catalog/*  -> catalog:3000   (prefix stripped)
#   /api/orders/*   -> order:8000     (prefix stripped)
#   /*              -> frontend:8080
# Only routes the browser needs are exposed. Internal endpoints (stock
# reserve/release, product admin, metrics, probes) are reachable only from
# inside the network.

log_format gateway escape=json
  '{"time":"$time_iso8601","level":"INFO","method":"$request_method",'
  '"path":"$request_uri","status":$status,"upstream":"$upstream_addr",'
  '"duration_s":$request_time,"upstream_s":"$upstream_response_time",'
  '"request_id":"$req_id"}';

# Keep a caller-supplied request id, otherwise generate one. Every service logs
# it, so one id follows a request through gateway, order and catalog.
map $http_x_request_id $req_id {
  default $http_x_request_id;
  ""      $request_id;
}

# Docker's embedded DNS. With a variable in proxy_pass, nginx resolves the name
# per request, so restarting a container (new IP) doesn't break routing.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8080;
  server_name _;
  server_tokens off;
  access_log /dev/stdout gateway;
  client_max_body_size 64k;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Request-Id $req_id;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 2s;
  proxy_read_timeout 15s;
  # Services echo the id too; hide theirs so the response carries exactly one.
  proxy_hide_header X-Request-Id;
  add_header X-Request-Id $req_id always;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # ---- catalog: read-only from the outside ----
  # Regexes containing {n} must be quoted, or nginx parses the brace as a block.
  location ~ "^/api/catalog/(v1/products(/[0-9a-f-]{36})?)$" {
    limit_except GET { deny all; }
    set $upstream http://catalog:3000;
    proxy_pass $upstream/$1$is_args$args;
  }

  # ---- orders: place an order, read one by its (unguessable) id ----
  # No GET /v1/orders listing: without authentication it would expose every
  # customer's email address.
  location = /api/orders/v1/orders {
    limit_except POST { deny all; }
    set $upstream http://order:8000;
    proxy_pass $upstream/v1/orders;
  }
  location ~ "^/api/orders/(v1/orders/[0-9a-f-]{36})$" {
    limit_except GET { deny all; }
    set $upstream http://order:8000;
    proxy_pass $upstream/$1;
  }

  # Everything else under /api is not public.
  location /api/ {
    default_type application/json;
    return 404 '{"detail":"not found"}';
  }

  location / {
    set $upstream http://frontend:8080;
    proxy_pass $upstream;
  }
}
